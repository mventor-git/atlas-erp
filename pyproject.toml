[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-erp"
version = "0.1.0"
description = "Standalone Atlas ERP protocol foundation"
requires-python = ">=3.14"
dependencies = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["atlas_erp*"]
